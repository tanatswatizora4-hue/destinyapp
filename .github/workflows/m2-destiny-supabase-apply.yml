name: M2 Destiny Supabase apply

# Registered on default branch via PR #13 so workflow_dispatch appears in Actions UI.
# When running: select branch cursor/m2-destiny-backend-migration-194a (has scripts + LFS media).
#
# Manual-only. Applies schema + inventory/media migration to destiny-os ONLY.
# Required GitHub secret: SUPABASE_ACCESS_TOKEN (PAT; bootstraps service_role + anon).
# Optional: SUPABASE_SERVICE_ROLE_KEY, DESTINY_SUPABASE_ANON_KEY
# Never targets Wanzwei. Prefer staged LFS media (default).

on:
  workflow_dispatch:
    inputs:
      migrate_media:
        description: Upload staged LFS media into destiny-media (recommended)
        type: boolean
        default: true
      redownload_legacy_media:
        description: Also re-download legacy images during migrate (usually leave off)
        type: boolean
        default: false
      apply_seed_sql:
        description: Also apply inventory_seed_owned_media.sql after migrator
        type: boolean
        default: false
      skip_schema:
        description: Skip schema apply (SQL already pasted in Dashboard)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://xchddfpfzrzhlbbmyhyn.supabase.co
      SUPABASE_PROJECT_REF: xchddfpfzrzhlbbmyhyn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DESTINY_SUPABASE_ANON_KEY: ${{ secrets.DESTINY_SUPABASE_ANON_KEY }}
      DESTINY_MIGRATE_FROM_SNAPSHOT: "1"
      DESTINY_MIGRATE_MEDIA: ${{ inputs.redownload_legacy_media && '1' || '0' }}
      DESTINY_SKIP_MEDIA: ${{ inputs.migrate_media && '0' || '1' }}
      DESTINY_SKIP_SCHEMA: ${{ inputs.skip_schema && '1' || '0' }}
      DESTINY_APPLY_OWNED_SEED: ${{ inputs.apply_seed_sql && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Guard project target + token
        run: |
          set -euo pipefail
          case "$SUPABASE_URL" in
            *xchddfpfzrzhlbbmyhyn*) echo "target ok: $SUPABASE_URL" ;;
            *) echo "refusing non-destiny-os URL"; exit 1 ;;
          esac
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "missing SUPABASE_ACCESS_TOKEN"; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve LFS media tarball (if uploading media)
        if: ${{ inputs.migrate_media }}
        run: |
          set -euo pipefail
          git lfs pull --include='supabase/seed/destiny-inventory-media-staged.tar'
          if head -1 supabase/seed/destiny-inventory-media-staged.tar | grep -q 'git-lfs'; then
            echo "ERROR: LFS pointer not resolved for media tarball" >&2
            exit 1
          fi

      - name: One-shot apply (schema + inventory + media + verify + finalize docs)
        run: bash scripts/apply_m2_remote.sh

      - name: Prove catalog live
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/storage/v1/object/public/destiny-media/inventory/catalog.json")
          echo "inventory/catalog.json HTTP $code"
          test "$code" = "200"
